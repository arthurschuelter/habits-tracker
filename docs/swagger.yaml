basePath: /api/v2
definitions:
  api.CreateEntryRequestRequestDTO:
    properties:
      date:
        description: Optional YYYY-MM-DD date. Omitted or blank values use the server's
          current date.
        example: "2026-11-16"
        type: string
      duration:
        example: 20
        maximum: 32767
        minimum: 1
        type: integer
      habit_id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
    required:
    - duration
    - habit_id
    type: object
  api.CreateHabitRequestDTO:
    properties:
      description:
        example: Read for 20 minutes
        type: string
      name:
        example: Read
        minLength: 1
        type: string
      user_id:
        example: 0a483f13-1ffc-4f85-aa71-98a9b96fedfe
        format: uuid
        type: string
    required:
    - name
    - user_id
    type: object
  api.errorResponseDTO:
    properties:
      message:
        example: invalid request body
        type: string
    type: object
  api.habitEntryResponseDTO:
    properties:
      date:
        example: "2026-11-16"
        format: date
        type: string
      duration:
        description: Recorded minutes. Legacy NULL durations are returned as zero.
        example: 20
        maximum: 32767
        minimum: 0
        type: integer
      habit_id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
      id:
        example: 22222222-2222-2222-2222-222222222222
        format: uuid
        type: string
    type: object
  api.habitResponseDTO:
    properties:
      created_at:
        description: Creation timestamp in RFC3339 format; null for legacy habits
          with an unknown creation time.
        example: "2026-11-17T12:34:56Z"
        format: date-time
        type: string
        x-nullable: true
      description:
        example: Read for 20 minutes
        type: string
      entries:
        items:
          $ref: '#/definitions/api.habitEntryResponseDTO'
        type: array
      highest_streak:
        example: 7
        minimum: 0
        type: integer
      id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
      name:
        example: Read
        type: string
      streak:
        example: 2
        minimum: 0
        type: integer
    type: object
info:
  contact: {}
  description: Create habits, list habits with daily entries and streaks, and record
    time spent on a habit. Authentication is not implemented; listing uses a fixed
    development user.
  title: Habits Tracker API
  version: "2.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Greeting message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the API greeting
      tags:
      - General
  /habit_entries:
    post:
      consumes:
      - application/json
      description: Records whole minutes for an existing habit. An omitted or blank
        date defaults to today's date in the server's local time. Dates use YYYY-MM-DD.
        Only one entry per habit/date is allowed; duplicate requests do not accumulate
        duration. Returns an empty body on success. The legacy entry_date field is
        not supported; use date.
      parameters:
      - description: Entry to record
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/api.CreateEntryRequestRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Entry created; empty body
        "400":
          description: Invalid request body, habit_id, date, or duration
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "404":
          description: Habit not found
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "409":
          description: Entry already exists for this habit and date
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Record a habit entry
      tags:
      - Habit entries
  /habits:
    get:
      description: Lists habits for the fixed development user 0a483f13-1ffc-4f85-aa71-98a9b96fedfe.
        No user selection or authentication is available. Entries are arrays (empty
        when none exist). Current streaks count consecutive recorded dates ending
        today or yesterday in the server's local time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.habitResponseDTO'
            type: array
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: List habits
      tags:
      - Habits
    post:
      consumes:
      - application/json
      description: Requires a nonblank name and an existing user's ID. The name is
        trimmed. Returns an empty body on success. Invalid or nonexistent user IDs
        currently result in a server error.
      parameters:
      - description: Habit to create
        in: body
        name: habit
        required: true
        schema:
          $ref: '#/definitions/api.CreateHabitRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Habit created; empty body
        "400":
          description: Invalid request body or missing name/user_id
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Create a habit
      tags:
      - Habits
swagger: "2.0"
