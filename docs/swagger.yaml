basePath: /api/v2
definitions:
  api.CreateEntryRequestRequestDTO:
    properties:
      date:
        description: Optional YYYY-MM-DD date. Omitted or blank values use the server's
          current date.
        example: "2026-11-16"
        type: string
      duration:
        example: 20
        maximum: 32767
        minimum: 1
        type: integer
      habit_id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
    required:
    - duration
    - habit_id
    type: object
  api.CreateHabitRequestDTO:
    properties:
      description:
        example: Read for 20 minutes
        type: string
      name:
        example: Read
        minLength: 1
        type: string
    required:
    - name
    type: object
  api.UpdateHabitRequestDTO:
    properties:
      archived:
        description: true archives the habit; false restores it.
        example: true
        type: boolean
        x-nullable: true
      name:
        description: New name; trimmed and must be nonblank when present.
        example: Read before bed
        minLength: 1
        type: string
        x-nullable: true
    type: object
  api.errorResponseDTO:
    properties:
      message:
        example: invalid request body
        type: string
    type: object
  api.forgotPasswordRequestDTO:
    properties:
      email:
        example: alex@example.com
        format: email
        type: string
    required:
    - email
    type: object
  api.habitEntryResponseDTO:
    properties:
      date:
        example: "2026-11-16"
        format: date
        type: string
      duration:
        description: Recorded minutes. Legacy NULL durations are returned as zero.
        example: 20
        maximum: 32767
        minimum: 0
        type: integer
      habit_id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
      id:
        example: 22222222-2222-2222-2222-222222222222
        format: uuid
        type: string
    type: object
  api.habitResponseDTO:
    properties:
      archived:
        example: false
        type: boolean
      created_at:
        example: "2026-11-17T12:34:56Z"
        format: date-time
        type: string
        x-nullable: true
      description:
        example: Read for 20 minutes
        type: string
      entries:
        items:
          $ref: '#/definitions/api.habitEntryResponseDTO'
        type: array
      highest_streak:
        example: 7
        minimum: 0
        type: integer
      id:
        example: 11111111-1111-1111-1111-111111111111
        format: uuid
        type: string
      name:
        example: Read
        type: string
      streak:
        example: 2
        minimum: 0
        type: integer
    type: object
  api.loginRequestDTO:
    properties:
      password:
        format: password
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  api.loginResponseDTO:
    properties:
      token:
        type: string
    type: object
  api.registerRequestDTO:
    properties:
      email:
        example: alex@example.com
        format: email
        type: string
      password:
        format: password
        minLength: 8
        type: string
      username:
        example: alex
        type: string
    required:
    - email
    - password
    - username
    type: object
  api.resetPasswordRequestDTO:
    properties:
      code:
        example: K3QZ7WMA
        type: string
      email:
        example: alex@example.com
        format: email
        type: string
      password:
        format: password
        minLength: 8
        type: string
    required:
    - code
    - email
    - password
    type: object
info:
  contact: {}
  description: Create habits, list habits with daily entries and streaks, and record
    time spent on a habit. Habit routes require an authenticated session.
  title: Habits Tracker API
  version: "2.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Greeting message
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the API greeting
      tags:
      - General
  /forgot-password:
    post:
      consumes:
      - application/json
      description: 'Create a one-time reset code for the account with this email,
        replacing any earlier code. The response is the same whether or not the account
        exists. Codes expire after 15 minutes. Email delivery is not implemented yet:
        the API writes the code to its log. Use the code with POST /reset-password.'
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.forgotPasswordRequestDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Reset code issued if the account exists
        "400":
          description: Invalid request body or email
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Request a password reset code
      tags:
      - Authentication
  /habit_entries:
    post:
      consumes:
      - application/json
      description: Records whole minutes for a habit owned by the authenticated user.
        An omitted or blank date defaults to today's date in the server's local time.
        Dates use YYYY-MM-DD. Only one entry per habit/date is allowed; duplicate
        requests do not accumulate duration. Returns an empty body on success. The
        legacy entry_date field is not supported; use date.
      parameters:
      - description: Entry to record
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/api.CreateEntryRequestRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Entry created; empty body
        "400":
          description: Invalid request body, habit_id, date, or duration
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "404":
          description: Habit not found
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "409":
          description: Entry already exists for this habit and date
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      security:
      - BearerAuth: []
      summary: Record a habit entry
      tags:
      - Habit entries
  /habits:
    get:
      description: Lists habits for the authenticated user. Entries are arrays (empty
        when none exist). Current streaks count consecutive recorded dates ending
        today or yesterday in the server's local time.
      parameters:
      - description: 'Archive filter: false (default) returns active habits, true
          returns archived habits, all returns both'
        enum:
        - "false"
        - "true"
        - all
        in: query
        name: archived
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.habitResponseDTO'
            type: array
        "400":
          description: Invalid archived filter
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      security:
      - BearerAuth: []
      summary: List habits
      tags:
      - Habits
    post:
      consumes:
      - application/json
      description: Creates a habit for the authenticated user. The name is trimmed
        and must be nonblank. Returns an empty body on success.
      parameters:
      - description: Habit to create
        in: body
        name: habit
        required: true
        schema:
          $ref: '#/definitions/api.CreateHabitRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Habit created; empty body
        "400":
          description: Invalid request body or missing name
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      security:
      - BearerAuth: []
      summary: Create a habit
      tags:
      - Habits
  /habits/{id}:
    patch:
      consumes:
      - application/json
      description: Partially updates a habit owned by the authenticated user. Send
        name to rename it (trimmed, must be nonblank) and/or archived to archive (true)
        or restore (false) it. Omitted fields are unchanged; at least one field is
        required. Repeating a request is harmless. Returns an empty body on success.
      parameters:
      - description: Habit ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: habit
        required: true
        schema:
          $ref: '#/definitions/api.UpdateHabitRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Habit updated; empty body
        "400":
          description: Invalid request body, habit ID, or name, or no fields to change
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "404":
          description: Habit not found
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      security:
      - BearerAuth: []
      summary: Update a habit
      tags:
      - Habits
  /login:
    post:
      consumes:
      - application/json
      description: Sign in with an existing username and password. The bearer token
        expires after 24 hours. Signing in again replaces the previous session for
        that user.
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/api.loginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginResponseDTO'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Sign in
      tags:
      - Authentication
  /register:
    post:
      consumes:
      - application/json
      description: Create an account with a username, email, and password. The username
        and email are trimmed, and the email is lowercased. Passwords need at least
        8 characters and at most 1024 bytes. Returns an empty body; sign in with POST
        /login to get a session token.
      parameters:
      - description: Account details
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/api.registerRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Account created
        "400":
          description: Invalid request body or field
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "409":
          description: Username or email already in use
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Register
      tags:
      - Authentication
  /reset-password:
    post:
      consumes:
      - application/json
      description: Choose a new password with the email and a code from POST /forgot-password.
        Passwords need at least 8 characters and at most 1024 bytes. The code works
        once, and resetting signs out the account's current session. Sign in with
        POST /login afterwards.
      parameters:
      - description: Email, reset code, and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.resetPasswordRequestDTO'
      produces:
      - application/json
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid request body, field, or reset code
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/api.errorResponseDTO'
      summary: Reset password
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    description: Use Bearer followed by a space and the token from POST /login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
